[package]
name = "clipforge"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["multipart"] }
base64 = "0.23.1"
hound = "3.5.1"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["fs"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.29.2", features = ["v4"] }
whisper-rs = { version = "0.16.0", features = ["metal"] }

# Faster dev builds: less debug info, deps built once and cached.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

# whisper.cpp is C++ built via cmake; unoptimized it is also very slow at runtime.
[profile.dev.package.whisper-rs-sys]
opt-level = 3

# Release: faster compiles than full LTO, still well optimized.
[profile.release]
lto = "thin"
codegen-units = 16
